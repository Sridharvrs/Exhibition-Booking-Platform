
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Stackly</title>

  <!-- Common CSS -->
  <link rel="stylesheet" href="css/common.css">

  <!-- Error Page CSS -->
  <link rel="stylesheet" href="css/error.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <!-- =========================
       ERROR PAGE
  ========================== -->
  <main class="error-page">

    <div class="error-background"></div>
    <div class="error-overlay"></div>

    <div class="error-decoration error-decoration-one"></div>
    <div class="error-decoration error-decoration-two"></div>

    <div class="error-content">

      <span class="error-eyebrow">
        <span></span>
        STACKLY EXHIBITIONS
        <span></span>
      </span>

      <div class="error-number">
        404
      </div>

      <h1>
        This Exhibition<br>
        <em>Could Not Be Found.</em>
      </h1>

      <p>
        The page you're looking for may have been moved, removed,
        or is currently unavailable. Let's get you back to the
        world of art and exhibitions.
      </p>

      <div class="error-actions">

        <a onclick="window.history.back()" class="btn error-primary-btn">
          <i class="fa-solid fa-house"></i>
          Back to Dashboard
        </a>

        <a href="exhibitions.html" class="error-secondary-btn">
          Browse Exhibitions
          <span>↗</span>
        </a>

      </div>

      <div class="error-bottom">

        <div class="error-line"></div>

        <span>
          <i class="fa-regular fa-compass"></i>
          Your next exhibition awaits
        </span>

        <div class="error-line"></div>

      </div>

    </div>

  </main>

</body>
</html>
